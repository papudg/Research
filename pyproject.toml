[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icaa-repro"
version = "0.1.0"
description = "Reproducibility package for policy-aware CP-SAT examination paper assembly (ICAA)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ortools==9.15.6755",
  "numpy==2.5.2",
  "scipy==1.18.0",
  "scikit-learn>=1.5",
  "sentence-transformers==5.7.0",
  "transformers==5.15.0",
  "torch==2.13.0",
  "spacy==3.8.15",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["experiments"]
pythonpath = ["src"]
